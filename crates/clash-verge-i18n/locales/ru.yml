_version: 1
notifications:
  dashboardToggled:
    title: Панель
    body: Видимость панели обновлена.
  clashModeChanged:
    title: Смена режима
    body: Переключено на {mode}.
  systemProxyToggled:
    title: Системный прокси
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  tunModeToggled:
    title: Режим TUN
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  lightweightModeEntered:
    title: Легкий режим
    body: Включен легкий режим.
  profilesReactivated:
    title: Профили
    body: Профиль повторно активирован.
  appQuit:
    title: Скорый выход
    body: Clash Mini скоро завершит работу.
  appHidden:
    title: Приложение скрыто
    body: Clash Mini работает в фоновом режиме.
  updateReady:
    title: Clash Mini Update
    body: A new version (v{version}) has been downloaded and is ready to install.
    installNow: Install Now
    later: Later
service:
  adminInstallPrompt: Для установки службы Clash Mini требуются права администратора.
  adminUninstallPrompt: Для удаления службы Clash Mini требуются права администратора.
