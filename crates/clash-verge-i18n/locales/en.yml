_version: 1
notifications:
  dashboardToggled:
    title: Dashboard
    body: Dashboard visibility has been updated.
  clashModeChanged:
    title: Mode Switch
    body: Switched to {mode}.
  systemProxyToggled:
    title: System Proxy
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  tunModeToggled:
    title: TUN Mode
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  lightweightModeEntered:
    title: Lightweight Mode
    body: Entered lightweight mode.
  profilesReactivated:
    title: Profiles
    body: Profile Reactivated.
  appQuit:
    title: About to Exit
    body: Clash Mini is about to exit.
  appHidden:
    title: Application Hidden
    body: Clash Mini is running in the background.
service:
  adminInstallPrompt: Installing the Clash Mini service requires administrator privileges.
  adminUninstallPrompt: Uninstalling the Clash Mini service requires administrator privileges.
