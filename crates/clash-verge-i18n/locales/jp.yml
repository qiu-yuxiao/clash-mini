_version: 1
notifications:
  dashboardToggled:
    title: ダッシュボード
    body: ダッシュボードの表示状態が更新されました。
  clashModeChanged:
    title: モード切り替え
    body: '{mode} に切り替えました。'
  systemProxyToggled:
    title: システムプロキシ
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  tunModeToggled:
    title: TUN モード
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  lightweightModeEntered:
    title: 軽量モード
    body: 軽量モードに入りました。
  profilesReactivated:
    title: プロファイル
    body: プロファイルが再有効化されました。
  appQuit:
    title: 終了間近
    body: Clash Mini はまもなく終了します。
