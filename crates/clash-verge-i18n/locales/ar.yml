_version: 1
notifications:
  dashboardToggled:
    title: لوحة التحكم
    body: تم تحديث حالة عرض لوحة التحكم.
  clashModeChanged:
    title: تبديل الوضع
    body: تم التبديل إلى {mode}.
  systemProxyToggled:
    title: وكيل النظام
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  tunModeToggled:
    title: وضع TUN
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  lightweightModeEntered:
    title: الوضع الخفيف
    body: تم الدخول إلى الوضع الخفيف.
  profilesReactivated:
    title: الملفات التعريفية
    body: تمت إعادة تفعيل الملف التعريفي.
  appQuit:
    title: على وشك الخروج
    body: Clash Mini على وشك الخروج.
  appHidden:
    title: تم إخفاء التطبيق
    body: Clash Mini يعمل في الخلفية.
  updateReady:
    title: Clash Mini Update
    body: A new version (v{version}) has been downloaded and is ready to install.
    installNow: Install Now
    later: Later
service:
  adminInstallPrompt: يتطلب تثبيت خدمة Clash Mini صلاحيات المسؤول.
  adminUninstallPrompt: يتطلب إلغاء تثبيت خدمة Clash Mini صلاحيات المسؤول.
