_version: 1
notifications:
  dashboardToggled:
    title: 대시보드
    body: 대시보드 표시 상태가 업데이트되었습니다.
  clashModeChanged:
    title: 모드 전환
    body: '{mode}(으)로 전환되었습니다.'
  systemProxyToggled:
    title: 시스템 프록시
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  tunModeToggled:
    title: TUN 모드
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  lightweightModeEntered:
    title: 경량 모드
    body: 경량 모드에 진입했습니다.
  profilesReactivated:
    title: 프로필
    body: 프로필이 다시 활성화되었습니다.
  appQuit:
    title: 곧 종료
    body: Clash Mini가 곧 종료됩니다.
  appHidden:
    title: 앱이 숨겨짐
    body: Clash Mini가 백그라운드에서 실행 중입니다.
  updateReady:
    title: Clash Mini Update
    body: A new version (v{version}) has been downloaded and is ready to install.
    installNow: Install Now
    later: Later
service:
  adminInstallPrompt: Clash Mini 서비스 설치에는 관리자 권한이 필요합니다.
  adminUninstallPrompt: Clash Mini 서비스 제거에는 관리자 권한이 필요합니다.
