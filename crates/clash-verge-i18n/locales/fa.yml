_version: 1
notifications:
  dashboardToggled:
    title: داشبورد
    body: وضعیت نمایش داشبورد به‌روزرسانی شد.
  clashModeChanged:
    title: تغییر حالت
    body: به {mode} تغییر کرد.
  systemProxyToggled:
    title: پروکسی سیستم
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  tunModeToggled:
    title: حالت TUN
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  lightweightModeEntered:
    title: حالت سبک
    body: به حالت سبک وارد شد.
  profilesReactivated:
    title: پروفایل‌ها
    body: پروفایل دوباره فعال شد.
  appQuit:
    title: در آستانه خروج
    body: Clash Mini در آستانه خروج است.
  appHidden:
    title: برنامه پنهان شد
    body: Clash Mini در پس‌زمینه در حال اجراست.
  updateReady:
    title: Clash Mini Update
    body: A new version (v{version}) has been downloaded and is ready to install.
    installNow: Install Now
    later: Later
service:
  adminInstallPrompt: نصب سرویس Clash Mini به دسترسی مدیر نیاز دارد.
  adminUninstallPrompt: حذف سرویس Clash Mini به دسترسی مدیر نیاز دارد.
