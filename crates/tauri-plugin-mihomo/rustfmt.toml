edition = "2024"
style_edition = "2024"
max_width = 120
hard_tabs = false
tab_spaces = 4
newline_style = "Auto"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
merge_derives = true
use_try_shorthand = false
use_field_init_shorthand = false
force_explicit_abi = true

# 原上游此处留有 imports_granularity = "Crate" 与 group_imports = "StdExternalCrate"，
# 但这两项至今仍是 rustfmt 的 nightly-only 特性（rustfmt 1.9 / stable 会打印
# "unstable features are only available in nightly channel" 并**静默忽略**）。
# 项目的 rust-toolchain.toml 与 CI（rustfmt.yml: dtolnay/rust-toolchain@stable）
# 都固定在 stable，保留它们只会造成「本地与 CI 口径看似不同、实际都被忽略」的假象，
# 因此移除。移除后回到默认 "Preserve"：不改写、不合并既有 import 分组，
# 现有代码的 import 排版保持原样，不会产生任何重构 diff。
