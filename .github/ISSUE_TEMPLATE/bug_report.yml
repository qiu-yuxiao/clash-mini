name: 问题反馈 / Bug report
title: "[BUG] "
description: 反馈你遇到的问题 / Report the issue you are experiencing
labels: ["bug"]
type: "Bug"

body:
  - type: markdown
    attributes:
      value: |
        ## 在提交问题之前，请确认以下事项：

        1. 请先查看 [已有的问题](https://github.com/qiu-yuxiao/clash-mini/issues?q=is%3Aissue)，避免重复提交。
        2. 请填写简洁明了的标题与完整复现步骤，以便定位问题。
        3. 本项目仅支持 **Windows** 桌面环境；建议通过托盘或主窗口「帮助菜单 → 导出诊断信息」生成脱敏诊断包后附加关键信息（切勿泄露节点密钥或订阅链接）。

        ## Before submitting the issue:

        1. Please check [existing issues](https://github.com/qiu-yuxiao/clash-mini/issues?q=is%3Aissue) to avoid duplicates.
        2. Provide a concise title and clear reproduction steps.
        3. Clash Mini targets **Windows** only; please export sanitized diagnostics via "Help Menu -> Export Diagnostics" (never share subscription URLs or proxy secrets).

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Describe the bug
      description: 详细清晰地描述你遇到的问题，并可附带脱敏截图 / Describe the issue clearly
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clash Mini 版本 / App Version
      description: 请填写具体的 Clash Mini 版本号（如 v3.3.4）/ Please provide the Clash Mini version (e.g. v3.3.4)
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / To Reproduce
      description: 请提供可稳定复现的操作步骤 / Steps to reproduce the behavior
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Windows 版本 / Windows Version
      description: 例如 Windows 11 24H2 / e.g. Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断摘要或关键日志 / Diagnostics Summary or Logs
      description: 粘贴脱敏后的日志片段（通过设置或诊断目录获取），注意移除订阅链接与节点敏感信息 / Paste sanitized log excerpts (strip any subscription URLs or node secrets)
      render: log
    validations:
      required: true
