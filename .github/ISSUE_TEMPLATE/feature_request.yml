name: 功能请求 / Feature request
title: "[Feature] "
description: 提出你的功能建议或体验优化想法 / Propose a feature or UX improvement
labels: ["enhancement"]
type: "Feature"

body:
  - type: markdown
    attributes:
      value: |
        ## 在提交建议之前，请确认以下事项：

        1. 请先查看 [已有的问题与建议](https://github.com/qiu-yuxiao/clash-mini/issues?q=is%3Aissue)，避免重复提交。
        2. Clash Mini 主打极简、稳态、Windows 原生开箱即用体验，请在描述中说明功能必要性及使用场景。

        ## Before submitting:

        1. Please check [existing issues](https://github.com/qiu-yuxiao/clash-mini/issues?q=is%3Aissue) to avoid duplicates.
        2. Clash Mini focuses on a minimal, reliable, out-of-the-box Windows experience. Please explain why the feature is needed.

  - type: textarea
    id: description
    attributes:
      label: 功能描述 / Feature description
      description: 清晰描述希望增加或改进的功能 / Describe the requested feature or improvement
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景 / Use case
      description: 说明该功能解决的实际问题与场景 / Explain the practical use case
    validations:
      required: true
