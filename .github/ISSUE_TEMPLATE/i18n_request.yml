name: I18N / 多语言相关
title: "[I18N] "
description: 用于多语言翻译修正、缺失补充或建议 / For translation corrections, missing strings, or i18n suggestions
labels: ["I18n"]
type: "Task"

body:
  - type: markdown
    attributes:
      value: |
        ## I18N 相关问题 / 建议
        请用此模板提交 Clash Mini 界面文本的翻译错误、缺失或优化建议。
        Please use this template for Clash Mini UI translation errors, missing keys, or improvements.

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 详细描述你的 I18N 问题或建议 / Describe your i18n issue or suggestion in detail
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: 相关语言 / Language
      description: 例如 zh, zhtw, en, ja, ru 等 / e.g. zh, zhtw, en, ja, ru
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议或修正内容 / Suggestion or Correction
      description: 如果是翻译修正或优化，请填写建议文本 / Provide suggested translation text if applicable
    validations:
      required: false
  - type: checkboxes
    id: i18n-type
    attributes:
      label: 问题类型 / Issue Type
      options:
        - label: 翻译错误 / Translation error
        - label: 翻译缺失 / Missing translation
        - label: 建议优化 / Suggestion
        - label: 新增语言 / New language
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Clash Mini 版本 / App Version
      description: 请填写使用的 Clash Mini 具体版本（如 v3.3.4）/ Please provide the Clash Mini version (e.g. v3.3.4)
    validations:
      required: true
