name: Release Build

on:
  # 仅通过 git tag 触发，避免重复发布
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: '${{ github.workflow }} - ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  # ========== 第 1 步：快速验证（1-2 分钟）==========
  # ⚠️ 必须在编译前完成所有验证，失败立即退出，不浪费 CI 时间
  validate:
    name: Quick Validation (Fail Fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if tag is from dev branch
        run: |
          TAG_REF="${GITHUB_REF##*/}"
          echo "Checking if tag $TAG_REF is from dev branch..."

          TAG_COMMIT=$(git rev-list -n 1 $TAG_REF)
          DEV_COMMITS=$(git rev-list origin/dev)

          if echo "$DEV_COMMITS" | grep -q "$TAG_COMMIT"; then
            echo "✅ Tag $TAG_REF is from dev branch"
          else
            echo "❌ Tag $TAG_REF is not from dev branch"
            echo "This release workflow only accepts tags from dev branch."
            exit 1
          fi

      - name: Check tag and package.json version
        run: |
          TAG_REF="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          echo "Current tag: $TAG_REF"

          PKG_VERSION=$(jq -r .version package.json)
          echo "package.json version: $PKG_VERSION"

          EXPECTED_TAG="v$PKG_VERSION"

          if [[ "$TAG_REF" != "$EXPECTED_TAG" && "$TAG_REF" != "$EXPECTED_TAG-full" && "$TAG_REF" != "$EXPECTED_TAG-all" ]]; then
            echo "❌ Version mismatch:"
            echo "   Git tag       : $TAG_REF"
            echo "   package.json  : $EXPECTED_TAG"
            exit 1
          fi

      # ⚠️ 预验证 git 推送权限（不实际推送，只检查认证）
      - name: Pre-validate git authentication
        run: |
          echo "Validating GitHub authentication..."
          gh auth status
          echo "✅ GitHub authentication valid"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ 预检查 dev 分支状态（避免编译完后 push 失败）
      - name: Pre-check dev branch accessibility
        run: |
          echo "Checking dev branch accessibility..."
          git fetch origin dev
          DEV_HEAD=$(git rev-parse origin/dev)
          echo "✅ dev branch is accessible: $DEV_HEAD"

          echo "Checking if app-update.json can be updated..."
          git checkout origin/dev -- updater/app-update.json 2>/dev/null || echo "⚠️ app-update.json not found on dev (will be created)"
          echo "✅ Pre-check passed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========== 第 2 步：Windows x64 构建（30 分钟）==========
  # ⚠️ 只有 validate 步骤通过后才会执行
  build:
    name: Build Windows x64 (Setup + Portable)
    needs: [validate]
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: x86_64-pc-windows-msvc

      - name: Add Rust Target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: true
          prefix-key: 'v1-rust'
          key: 'rust-shared-stable-windows-x64'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm Cache
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: 'pnpm-shared-stable-windows-x64'
          restore-keys: |
            pnpm-shared-stable-windows-x64

      - name: Pnpm install and build
        run: |
          pnpm i
          pnpm run prebuild x86_64-pc-windows-msvc
          pnpm run web:build

      # Tauri build → 生成 setup.exe 并自动签名（如果私钥环境变量已设置）
      - name: Tauri build (generates setup.exe)
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Clash Mini Ver.${{ github.ref_name }}'
          releaseBody: 'Draft release, will be updated later.'
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          tauriScript: pnpm
          args: --target x86_64-pc-windows-msvc

      # 预检：确认构建产物目录结构正确
      - name: Verify build artifacts (pre-check)
        shell: bash
        run: |
          echo "=== Verifying build artifacts ==="
          echo "Looking for bundle directory..."
          BUNDLE_DIR="target/x86_64-pc-windows-msvc/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "❌ ERROR: Bundle directory not found!"
            echo "Expected: $BUNDLE_DIR"
            echo "Contents of target/:"
            ls -la target/x86_64-pc-windows-msvc/release/ || true
            echo ""
            echo "💡 HINT: If you changed tauri.conf.json productName or build config,"
            echo "   make sure .github/workflows/release.yml paths are updated too!"
            exit 1
          fi
          echo "✅ Bundle directory found: $BUNDLE_DIR"
          echo ""
          echo "Contents of bundle/:"
          find "$BUNDLE_DIR" -type f -name "*.exe" | head -10
          echo ""
          # 确认 setup.exe 存在
          SETUP_EXE=$(find "$BUNDLE_DIR/nsis" -name "*.exe" -type f 2>/dev/null | head -1)
          if [ -z "$SETUP_EXE" ]; then
            echo "❌ ERROR: No setup.exe found in $BUNDLE_DIR/nsis/"
            echo "Contents of bundle/:"
            find "$BUNDLE_DIR" -type f | head -20
            exit 1
          fi
          echo "✅ setup.exe found: $SETUP_EXE"
          echo "=== Pre-check passed ==="

      # 签名 setup.exe（tauri build 可能已经签名，此步骤确保 .sig 文件存在）
      - name: Sign setup.exe and generate .sig
        shell: bash
        run: |
          # 动态查找 setup.exe（productName 可能含空格）
          SETUP_EXE=$(find target/x86_64-pc-windows-msvc/release/bundle/nsis -name "*.exe" -type f | head -1)
          if [ -z "$SETUP_EXE" ]; then
            echo "❌ setup.exe not found in bundle/nsis"
            ls -la target/x86_64-pc-windows-msvc/release/bundle/nsis/ || true
            exit 1
          fi
          echo "Found setup.exe: $SETUP_EXE"

          SETUP_SIG="${SETUP_EXE}.sig"

          echo "Signing: $SETUP_EXE"
          pnpm tauri signer sign "$SETUP_EXE"

          # 验证签名文件存在
          if [ ! -f "$SETUP_SIG" ]; then
            echo "❌ .sig file not found: $SETUP_SIG"
            exit 1
          fi
          echo "✅ .sig file generated: $SETUP_SIG"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      # 上传 .sig 到 Release
      - name: Upload .sig to Release
        shell: bash
        run: |
          SETUP_SIG=$(find target/x86_64-pc-windows-msvc/release/bundle/nsis -name "*.exe.sig" -type f | head -1)
          if [ -z "$SETUP_SIG" ]; then
            echo "❌ .sig file not found"
            exit 1
          fi
          echo "Found .sig: $SETUP_SIG"
          gh release upload ${{ github.ref_name }} "$SETUP_SIG" --repo qiu-yuxiao/clash-mini --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 便携版 ZIP（可选，不影响自动更新）
      - name: Portable Bundle (optional)
        run: pnpm portable x86_64-pc-windows-msvc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ========== 第 3 步：上传 latest.json 并公开正式 Release（1 分钟）==========
  # ⚠️ 先生成并上传 latest.json 至 Draft Release，再一次性切换 draft=false 原子公开，
  #    消除客户端在编译期/发布间隙提前发现新版本却下载失败的时间差（BUG-426）
  publish:
    name: Upload Manifest & Publish Release
    needs: [build]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and deduplicate draft Release
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF##*/}"
          matches=$(gh api repos/{owner}/{repo}/releases --paginate --jq '.[] | select(.tag_name == "'"$TAG_NAME"'") | [.id, .draft, (.assets | length), .html_url] | @tsv')
          release_count=$(grep -c . <<< "$matches" || true)

          if [ "$release_count" -eq 0 ]; then
            echo "::error::No release found for $TAG_NAME."
            exit 1
          fi

          if [ "$release_count" -gt 1 ]; then
            printf '%s\n' "$matches"
            echo "⚠️ Multiple releases found for $TAG_NAME. Auto-cleanup: keeping latest, deleting duplicates."
            latest=$(echo "$matches" | sort -t$'\t' -k1 -rn | head -1)
            latest_id=$(echo "$latest" | cut -f1)
            echo "$matches" | while IFS=$'\t' read -r dup_id _ _ dup_url; do
              if [ "$dup_id" != "$latest_id" ]; then
                echo "  Deleting duplicate release $dup_id ($dup_url)"
                gh api -X DELETE "repos/{owner}/{repo}/releases/$dup_id" --silent
              fi
            done
            matches="$latest"
          fi

          IFS=$'\t' read -r release_id _ asset_count release_url <<< "$matches"
          echo "Resolved release $release_id ($release_url) with $asset_count assets."
          echo "RELEASE_ID=$release_id" >> $GITHUB_ENV

      - name: Download setup.exe and .sig from Draft Release
        shell: bash
        run: |
          echo "Downloading setup.exe and .sig from Draft Release..."
          gh release download ${{ github.ref_name }} --repo qiu-yuxiao/clash-mini --pattern "*.exe" --pattern "*.sig" --dir ./downloads --clobber
          echo "✅ Downloaded:"
          ls -la ./downloads/

      - name: Generate and upload latest.json to Draft Release
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SETUP_EXE=$(find ./downloads -name "*.exe" -type f | head -1)
          SETUP_SIG=$(find ./downloads -name "*.sig" -type f | head -1)
          if [ -z "$SETUP_EXE" ] || [ -z "$SETUP_SIG" ]; then
            echo "::error::Missing setup.exe or .sig in ./downloads"
            exit 1
          fi
          SETUP_FILENAME=$(basename "$SETUP_EXE")
          SETUP_SIZE=$(stat --format=%s "$SETUP_EXE")
          SIG_CONTENT=$(cat "$SETUP_SIG" | tr -d '\n' | tr -d '\r')

          echo "Version: $VERSION | Filename: $SETUP_FILENAME | Size: $SETUP_SIZE"

          VERSION="$VERSION" SIG_CONTENT="$SIG_CONTENT" SETUP_SIZE="$SETUP_SIZE" SETUP_FILENAME="$SETUP_FILENAME" node <<'EOF'
            const fs = require('fs');
            const version = process.env.VERSION;
            const sig = process.env.SIG_CONTENT;
            const size = Number(process.env.SETUP_SIZE);
            const encodedFilename = encodeURIComponent(process.env.SETUP_FILENAME);

            let notes = 'Clash Mini v' + version;
            if (fs.existsSync('Changelog.md')) {
              const lines = fs.readFileSync('Changelog.md', 'utf8').split(/\r?\n/);
              const titleRegex = new RegExp('^##\\s+v?' + version.replace(/\./g, '\\.') + '\\b', 'i');
              const nextTitleRegex = /^##\s+v?\d+/i;
              let capturing = false;
              const captured = [];
              for (const line of lines) {
                if (titleRegex.test(line)) {
                  capturing = true;
                  continue;
                }
                if (capturing) {
                  if (
                    nextTitleRegex.test(line) ||
                    line.trim() === '## 原始版本历史 (Clash Verge History)'
                  ) {
                    break;
                  }
                  captured.push(line);
                }
              }
              const extracted = captured.join('\n').trim();
              if (extracted) {
                notes = extracted;
              }
            }

            const data = {
              version: version,
              notes: notes,
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: sig,
                  url: 'https://github.com/qiu-yuxiao/clash-mini/releases/download/v' + version + '/' + encodedFilename,
                  size: size
                }
              }
            };
            fs.writeFileSync('latest.json', JSON.stringify(data, null, 2) + '\n', 'utf8');
            console.log('✅ latest.json generated');
          EOF

          gh release upload ${{ github.ref_name }} latest.json --repo qiu-yuxiao/clash-mini --clobber
          echo "✅ latest.json uploaded to Draft Release"

      - name: Fetch UPDATE logs
        id: fetch_update_logs
        run: bash ./scripts/extract_update_logs.sh
        shell: bash

      - name: Set Env
        run: |
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV
          TAG_REF="${GITHUB_REF##*/}"
          echo "TAG_NAME=$TAG_REF" >> $GITHUB_ENV
          VERSION=$(echo "$TAG_REF" | sed 's/^v//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=https://github.com/qiu-yuxiao/clash-mini/releases/download/$TAG_REF" >> $GITHUB_ENV
        shell: bash

      - name: Generate release notes
        run: |
          if [ -z "$UPDATE_LOGS" ]; then
            echo "No update logs found, using default message"
            UPDATE_LOGS="More new features are now supported. Check for detailed changelog soon."
          fi

          cat > release.txt << EOF
          $UPDATE_LOGS

          ## 下载地址

          ### Windows 64位 安装版（推荐，支持自动更新）
          - [64位安装版](${DOWNLOAD_URL}/Clash.Mini_${VERSION}_x64-setup.exe)

          ### Windows 64位绿色便携版（免安装）
          - [64位便携版](${DOWNLOAD_URL}/Clash.Mini_${VERSION}_x64_portable.zip)

          ### 项目主页
          - [GitHub 主页](https://github.com/qiu-yuxiao/clash-mini)

          Created at ${BUILDTIME}.
          EOF
        shell: bash

      - name: Publish Release
        env:
          PRERELEASE: ${{ contains(github.ref_name, '-rc') }}
        run: |
          echo "Publishing release $RELEASE_ID with latest.json and binaries..."
          gh api --method PATCH repos/{owner}/{repo}/releases/"$RELEASE_ID" \
            -f name="Clash Mini Ver.${{ env.TAG_NAME }}" \
            -F body=@release.txt \
            -F draft=false \
            -F prerelease="$PRERELEASE" \
            --silent

  # ========== 第 4 步：同步 latest.json 至 updater/app-update.json（兼容旧版本平滑升级）==========
  update_dev:
    name: Sync app-update.json to dev
    needs: [publish]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync latest.json to updater/app-update.json
        shell: bash
        run: |
          echo "Downloading published latest.json..."
          gh release download ${{ github.ref_name }} --repo qiu-yuxiao/clash-mini --pattern "latest.json" --dir ./downloads --clobber
          mkdir -p updater
          cp ./downloads/latest.json updater/app-update.json
          echo "✅ updater/app-update.json synced from published Release"

      - name: Commit and push to dev branch
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updater/app-update.json
          git commit -m "chore: update app-update.json for v$VERSION [skip ci]" || echo "No changes to commit"
          git fetch origin dev
          git pull --rebase --autostash origin dev
          git push origin HEAD:dev --force-with-lease
