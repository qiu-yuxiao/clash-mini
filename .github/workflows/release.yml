name: Release Build

on:
  # 仅通过 git tag 触发，避免重复发布
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: '${{ github.workflow }} - ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  # 校验 tag 格式与 package.json 版本一致性
  check_tag_version:
    name: Check Release Tag and package.json Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if tag is from dev branch
        run: |
          TAG_REF="${GITHUB_REF##*/}"
          echo "Checking if tag $TAG_REF is from dev branch..."

          TAG_COMMIT=$(git rev-list -n 1 $TAG_REF)
          DEV_COMMITS=$(git rev-list origin/dev)

          if echo "$DEV_COMMITS" | grep -q "$TAG_COMMIT"; then
            echo "✅ Tag $TAG_REF is from dev branch"
          else
            echo "❌ Tag $TAG_REF is not from dev branch"
            echo "This release workflow only accepts tags from dev branch."
            exit 1
          fi

      - name: Check tag and package.json version
        run: |
          TAG_REF="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          echo "Current tag: $TAG_REF"

          PKG_VERSION=$(jq -r .version package.json)
          echo "package.json version: $PKG_VERSION"

          EXPECTED_TAG="v$PKG_VERSION"

          if [[ "$TAG_REF" != "$EXPECTED_TAG" && "$TAG_REF" != "$EXPECTED_TAG-full" && "$TAG_REF" != "$EXPECTED_TAG-all" ]]; then
            echo "❌ Version mismatch:"
            echo "   Git tag       : $TAG_REF"
            echo "   package.json  : $EXPECTED_TAG"
            exit 1
          fi

  # Windows x64 构建（setup.exe + 签名 + 上传）
  release:
    name: Release Build (Windows x64)
    needs: [check_tag_version]
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: x86_64-pc-windows-msvc

      - name: Add Rust Target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: true
          prefix-key: 'v1-rust'
          key: 'rust-shared-stable-windows-x64'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm Cache
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: 'pnpm-shared-stable-windows-x64'
          restore-keys: |
            pnpm-shared-stable-windows-x64

      - name: Pnpm install and build
        run: |
          pnpm i
          pnpm run prebuild x86_64-pc-windows-msvc
          pnpm run web:build

      # Tauri build → 生成 setup.exe 并自动签名（如果私钥环境变量已设置）
      - name: Tauri build (generates setup.exe)
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Clash Mini Ver.${{ github.ref_name }}'
          releaseBody: 'Draft release, will be updated later.'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          tauriScript: pnpm
          args: --target x86_64-pc-windows-msvc

      # 签名 setup.exe（tauri build 可能已经签名，此步骤确保 .sig 文件存在）
      - name: Sign setup.exe and generate .sig
        shell: bash
        run: |
          # 动态查找 setup.exe（productName 可能含空格）
          SETUP_EXE=$(find target/x86_64-pc-windows-msvc/release/bundle/nsis -name "*.exe" -type f | head -1)
          if [ -z "$SETUP_EXE" ]; then
            echo "❌ setup.exe not found in bundle/nsis"
            ls -la target/x86_64-pc-windows-msvc/release/bundle/nsis/ || true
            exit 1
          fi
          echo "Found setup.exe: $SETUP_EXE"

          SETUP_SIG="${SETUP_EXE}.sig"

          echo "Signing: $SETUP_EXE"
          pnpm tauri signer sign "$SETUP_EXE"

          # 验证签名文件存在
          if [ ! -f "$SETUP_SIG" ]; then
            echo "❌ .sig file not found: $SETUP_SIG"
            exit 1
          fi
          echo "✅ .sig file generated: $SETUP_SIG"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      # 上传 .sig 到 Release
      - name: Upload .sig to Release
        shell: bash
        run: |
          SETUP_SIG=$(find target/x86_64-pc-windows-msvc/release/bundle/nsis -name "*.exe.sig" -type f | head -1)
          if [ -z "$SETUP_SIG" ]; then
            echo "❌ .sig file not found"
            exit 1
          fi
          echo "Found .sig: $SETUP_SIG"
          gh release upload ${{ github.ref_name }} "$SETUP_SIG" --repo qiu-yuxiao/clash-mini --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 更新 app-update.json 并推送回 dev 分支
      - name: Update app-update.json and push to dev
        shell: bash
        run: |
          # 动态查找 setup.exe（productName 可能含空格）
          SETUP_EXE=$(find target/x86_64-pc-windows-msvc/release/bundle/nsis -name "*.exe" -type f | head -1)
          SETUP_SIG="${SETUP_EXE}.sig"
          SETUP_FILENAME=$(basename "$SETUP_EXE")
          VERSION=$(node -p "require('./package.json').version")

          echo "Setup: $SETUP_EXE"
          echo "Filename: $SETUP_FILENAME"

          # 用 node 更新 app-update.json（直接读文件，避免转义问题）
          SETUP_EXE="$SETUP_EXE" SETUP_SIG="$SETUP_SIG" SETUP_FILENAME="$SETUP_FILENAME" VERSION="$VERSION" node -e "
            const fs = require('fs');
            const setupExe = process.env.SETUP_EXE;
            const setupSig = process.env.SETUP_SIG;
            const setupFilename = process.env.SETUP_FILENAME;
            const version = process.env.VERSION;
            const sig = fs.readFileSync(setupSig, 'utf8').trim().replace(/\n/g, '').replace(/\r/g, '');
            const size = fs.statSync(setupExe).size;
            const encodedFilename = encodeURIComponent(setupFilename);
            const data = {
              version: version,
              notes: 'Clash Mini v' + version,
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: sig,
                  url: 'https://github.com/qiu-yuxiao/clash-mini/releases/download/v' + version + '/' + encodedFilename,
                  size: size
                }
              }
            };
            fs.writeFileSync('updater/app-update.json', JSON.stringify(data, null, 2) + '\n', 'utf8');
            console.log('app-update.json updated');
            console.log('URL: https://github.com/qiu-yuxiao/clash-mini/releases/download/v' + version + '/' + encodedFilename);
          "

          # 提交并推送回 dev 分支
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updater/app-update.json
          git commit -m "chore: update app-update.json for v$VERSION [skip ci]" || echo "No changes to commit"
          git push origin dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 便携版 ZIP（可选，不影响自动更新）
      - name: Portable Bundle (optional)
        run: pnpm portable x86_64-pc-windows-msvc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # 发布正式 Release（更新 Release Notes）
  publish_release:
    name: Publish Release
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch UPDATE logs
        id: fetch_update_logs
        run: bash ./scripts/extract_update_logs.sh
        shell: bash

      - name: Set Env
        run: |
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV
          TAG_REF="${GITHUB_REF##*/}"
          echo "TAG_NAME=$TAG_REF" >> $GITHUB_ENV
          VERSION=$(echo "$TAG_REF" | sed 's/^v//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=https://github.com/qiu-yuxiao/clash-mini/releases/download/$TAG_REF" >> $GITHUB_ENV
        shell: bash

      - name: Generate release notes
        run: |
          if [ -z "$UPDATE_LOGS" ]; then
            echo "No update logs found, using default message"
            UPDATE_LOGS="More new features are now supported. Check for detailed changelog soon."
          fi

          cat > release.txt << EOF
          $UPDATE_LOGS

          ## 下载地址

          ### Windows 64位 安装版（推荐，支持自动更新）
          - [64位安装版](${DOWNLOAD_URL}/Clash%20Mini_${VERSION}_x64-setup.exe)

          ### Windows 64位绿色便携版（免安装）
          - [64位便携版](${DOWNLOAD_URL}/Clash%20Mini_${VERSION}_x64_portable.zip)

          ### 项目主页
          - [GitHub 主页](https://github.com/qiu-yuxiao/clash-mini)

          Created at ${BUILDTIME}.
          EOF

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(github.ref_name, '-rc') }}
        run: |
          matches=$(gh api repos/{owner}/{repo}/releases --paginate --jq '.[] | select(.tag_name == env.TAG_NAME) | [.id, .draft, (.assets | length), .html_url] | @tsv')
          release_count=$(grep -c . <<< "$matches" || true)

          if [ "$release_count" -eq 0 ]; then
            echo "::error::No release found for $TAG_NAME."
            exit 1
          fi

          if [ "$release_count" -gt 1 ]; then
            printf '%s\n' "$matches"
            echo "::error::Multiple releases found for $TAG_NAME. Merge or delete duplicate releases before rerunning."
            exit 1
          fi

          IFS=$'\t' read -r release_id _ asset_count release_url <<< "$matches"
          echo "Publishing release $release_id ($release_url) with $asset_count assets."

          gh api --method PATCH repos/{owner}/{repo}/releases/"$release_id" \
            -f name="Clash Mini Ver.${{ env.TAG_NAME }}" \
            -F body=@release.txt \
            -F draft=false \
            -F prerelease="$PRERELEASE" \
            --silent
