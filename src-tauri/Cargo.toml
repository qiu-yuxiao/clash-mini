[package]
name = "clash-mini"
version = "2.2.8"
description = "clash verge"
authors = ["zzzgydi", "Tunglies", "wonfen", "MystiPanda"]
license = "GPL-3.0-only"
repository = "https://github.com/qiu-yuxiao/clash-mini.git"
default-run = "clash-mini"
build = "build.rs"
edition = "2024"
rust-version = "1.95"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
verge-dev = ["clash_verge_logger/color"]
tauri-dev = []
tokio-trace = ["console-subscriber"]
clippy = ["tauri/test"]
tracing = []

[package.metadata.bundle]
identifier = "io.github.clash-mini.clash-mini"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
clash-verge-draft = { workspace = true }
clash-verge-logging = { workspace = true }
clash-verge-signal = { workspace = true }
clash-verge-i18n = { workspace = true }
clash-verge-limiter = { workspace = true }
sysinfo = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri = { workspace = true, features = [
  "protocol-asset",
  "devtools",
  "tray-icon",
  "image-ico",
  "image-png",
] }
parking_lot = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
compact_str = { workspace = true }
flexi_logger = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
smartstring = { workspace = true, features = ["serde"] }
bitflags = { workspace = true }
warp = { version = "0.4.3", features = ["server"] }
open = "5.3.5"
dunce = "1.0.5"
nanoid = "0.5"
chrono = "0.4.44"
boa_engine = "0.21.1"
once_cell = { version = "1.21.4", features = ["parking_lot"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.3", features = [
  "json",
  "cookies",
  "rustls",
  "form",
] }
regex = "1.12.3"
sysproxy = { git = "https://github.com/clash-verge-rev/sysproxy-rs", rev = "f0775f6f4173c9dd6228cd7c3d183019b9ba6a7b", features = [
  "guard",
] }
network-interface = { version = "2.0.5", features = ["serde"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-window-state = "2.4.1"
zip = "8.6.0"
flate2 = "1.1.9"
reqwest_dav = "0.3.3"
aes-gcm = { version = "0.10.3", features = ["std"] }
base64 = "0.22.1"
getrandom = "0.4.2"
futures = "0.3.32"
socket2 = "0.6.3"
gethostname = "1.1.0"
scopeguard = "1.2.0"
tauri-plugin-notification = "2.3.3"
tokio-stream = "0.1.18"
backon = { version = "1.6.0", features = ["tokio-sleep"] }
tauri-plugin-http = "2.5.9"
console-subscriber = { version = "0.5.0", optional = true }
tauri-plugin-devtools = { version = "2.1.0" }
# WARNING: tauri-plugin-mihomo is customized locally in crates/tauri-plugin-mihomo to fix BUG-072
# (missing #[serde(rename_all = "lowercase")] on LogLevel causing Allow LAN toggle failure).
# If upgrading to a new upstream version (e.g. 0.5.3+), do NOT simply switch back to upstream git
# without confirming they fixed this deserialization issue. If upgrading, either:
# A) Copy the new upstream source to crates/tauri-plugin-mihomo and re-apply the patch, or
# B) Confirm upstream fixed the issue and then switch back to git.
tauri-plugin-mihomo = { path = "../crates/tauri-plugin-mihomo" }
clash_verge_logger = { git = "https://github.com/clash-verge-rev/clash-verge-logger", rev = "e4768e3852c4868ed86e7210df82c1178467820d" }
async-trait = "0.1.89"
clash_verge_service_ipc = { version = "2.3.0", features = [
  "client",
], git = "https://github.com/clash-verge-rev/clash-verge-service-ipc", rev = "21e661fa141e5ad3c705ee4cdb86efff8df6f769" }
arc-swap = "1.9.1"
tokio-rustls = "0.26.4"
rustls = { version = "0.23.40", features = ["ring"] }
webpki-roots = "1.0.7"
rust_iso3166 = "0.1.14"
# Use the git repo until the next release after v2.0.0.
dark-light = { git = "https://github.com/rust-dark-light/dark-light", rev = "0f18d2fbcaa5d1c175db8aae7d53428988d7e961" }
bytes = "1.11.1"
tokio-util = { version = "0.7.18", features = ["time"] }
url = "2.5.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = [
  "NSString",
  "NSDictionary",
  "NSAttributedString",
] }
objc2-app-kit = { version = "0.3.2", features = [
  "NSAttributedString",
  "NSStatusItem",
  "NSStatusBarButton",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSFont",
  "NSFontDescriptor",
  "NSColor",
  "NSParagraphStyle",
  "NSStringDrawing",
  "NSText",
] }

[target.'cfg(windows)'.dependencies]
deelevate = { workspace = true }
runas = "=1.2.0"
winreg = "0.56.0"
windows = { version = "0.61.3", features = ["Win32_Globalization", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
wry = "0.55.1"
webview2-com = "0.38.2"
raw-window-handle = "0.6.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-updater = "2.10.1"

[dev-dependencies]
criterion = { workspace = true }

[lints]
workspace = true
